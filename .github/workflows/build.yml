name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/signing/ci.jks"
          test -s "$RUNNER_TEMP/signing/ci.jks"
      - name: Test and build signed APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE: ${{ runner.temp }}/signing/ci.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Test pull request
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && success()
        with:
          name: NotificationGuard
          path: app/build/outputs/apk/release/*.apk
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
